[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py_shs"
version = "4.0.1"
description = "Second Harmonic Scattering (SHS) and Hyper-Rayleigh Scattering (HRS) calculations - pure Python / NumPy"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Pierre-Marie Gassin" , email="pierre-marie.gassin@enscm.fr"}]
keywords = ["second harmonic scattering", "SHS", "HRS", "hyper-Rayleigh", "nonlinear optics", "hyperpolarizability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]

[project.urls]
Homepage = "https://github.com/pmgassin/Py_SHS"
Repository = "https://github.com/pmgassin/Py_SHS"
Issues = "https://github.com/pmgassin/Py_SHS/issues"

[project.scripts]
pyshs-gui = "py_shs.pyshs_gui:main"
pyshs-hrs = "py_shs.cli:hrs"
pyshs-shs = "py_shs.cli:shs"
pyshs-sphere = "py_shs.cli:sphere"
pyshs-mie = "py_shs.cli:mie"
pyshs-cylinder = "py_shs.cli:cylinder"
pyshs-ellipsoid = "py_shs.cli:ellipsoid"
pyshs-cube = "py_shs.cli:cube"

[tool.setuptools.packages.find]
where = ["src"]
